name: Build deb
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cai cong cu
        run: brew install ldid dpkg
      - name: Cai Theos (ban roothide)
        run: |
          git clone --recursive https://github.com/roothide/theos.git $HOME/theos
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/sdks
          cp -R $HOME/sdks/*.sdk $HOME/theos/sdks/
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Build
        run: make package FINALPACKAGE=1
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: DualBT-deb
          path: packages/*.deb
